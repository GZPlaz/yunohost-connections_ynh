<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connections Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Custom Top Prompt / Toast Container -->
  <div id="toast" class="toast"></div>

  <div class="container">
    <h1 id="game-title">Connections</h1>
    <p class="subtitle">Create four groups of four!</p>
    
    <div id="solved-container"></div>
    <div id="grid" class="grid"></div>

    <div class="mistakes">
      Mistakes remaining: <span id="lives">••••</span>
    </div>

    <div class="controls">
      <button onclick="shuffleGrid()">Shuffle</button>
      <button onclick="deselectAll()">Deselect All</button>
      <button id="submit-btn" onclick="submitGuess()" disabled>Submit</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
